[project]
name = "ontoagent"
version = "0.1.0"
description = "OntoAgent AI Platform"
requires-python = ">=3.11"

dependencies = [
    "streamlit",
    "fastapi",
    "uvicorn",
    "langgraph",
    "langchain",
    "langchain-openai",
    "langchain-anthropic",
    "langfuse==4.13.2",
    "mcp>=1.2.0",
    "httpx",
    "sqlmodel",
    "pymysql",
    "python-dotenv",
    "openai",
    "fastmcp>=3.4.4",
    "langchain-mcp-adapters>=0.3.0",
    "neo4j>=6.2.0",
    "flask>=3.1.3",
    "langchain-google-genai>=4.2.7",
    "langchain-huggingface>=1.2.2",
    "discord-py>=2.7.1",
    "aiohttp>=3.14.1",
    "pandas>=3.0.3",
    "openpyxl>=3.1.5",
    "opencc>=1.4.1",
    "tree-sitter-languages>=1.10.2",
    "tree-sitter<0.22.0",
    "aiofiles>=25.1.0",
    "sqlalchemy>=2.0.51",
    "psycopg2-binary>=2.9.12",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
    "pytest-timeout>=2.3.1",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["test/unit"]
timeout = 5.0
# 1. 註冊自訂 mark，消除 PytestUnknownMarkWarning
markers = [
    "integration: integration tests that require external services",
]

[tool.ruff.lint]
ignore = [
    "BLE001",  # 允許捕捉盲目 Exception (專案防護降級需要)
    "LOG015",  # 允許直接使用 logging.info/error
    "G201",    # 允許 exc_info=True
    "DTZ005",  # 允許 datetime.now() 不帶時區
]
