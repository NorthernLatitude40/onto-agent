[project]
name = "ontoagent"
version = "0.1.0"
description = "OntoAgent AI Platform"
requires-python = ">=3.11"

dependencies = [
    "streamlit",
    "fastapi",
    "uvicorn",
    "langgraph",
    "langchain",
    "langchain-openai",
    "langchain-anthropic",
    "langfuse==4.13.2",
    "mcp",
    "httpx",
    "sqlmodel",
    "pymysql",
    "python-dotenv",
    "openai",
    "fastmcp>=3.4.4",
    "langchain-mcp-adapters>=0.3.0",
    "neo4j>=6.2.0",
    "flask>=3.1.3",
    "langchain-google-genai>=4.2.7",
    "langchain-huggingface>=1.2.2",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]
