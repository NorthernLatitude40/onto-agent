version: "3.8"

# 核心重點：直接引入同目錄下的 ClickHouse 設定檔
include:
  - clickhouse-compose.yml

services:
  # ==========================================
  # 📊 【監控層】Langfuse 基礎設施 (Postgres + ClickHouse 雙引擎)
  # ==========================================
  langfuse-pg:
    image: postgres:16-alpine
    container_name: langfuse-pg
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - POSTGRES_DB=langfuse
    volumes:
      - langfuse_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  langfuse-worker:
    image: docker.io/langfuse/langfuse-worker:3
    container_name: langfuse-worker
    restart: always
    depends_on:
      langfuse-pg:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:${PG_PASSWORD}@langfuse-pg:5432/langfuse
      # 【修正提示】這裡的主機名稱必須與 clickhouse 的服務名稱一致（即 langfuse-clickhouse）
      # 且資料庫名稱、帳密需與 clickhouse-compose.yml 對齊
      - CLICKHOUSE_URL=http://langfuse-clickhouse:8123
      - CLICKHOUSE_DB=my_database
      - CLICKHOUSE_MIGRATION_URL=${CLICKHOUSE_MIGRATION_URL}
      - CLICKHOUSE_USER=my_user
      - CLICKHOUSE_PASSWORD=my_password
      - SALT=${SALT}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=http://localhost:3000
      - TELEMETRY_ENABLED=false
      - CLICKHOUSE_CLUSTER_ENABLED=false
      - LANGFUSE_S3_EVENT_UPLOAD_BUCKET=langfuse
      - LANGFUSE_S3_EVENT_UPLOAD_REGION=us-east-1 # MinIO 默认填这个即可
      - LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=http://langfuse-minio:9000
      - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=minioadmin
      - LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=minioadminsecret
      - LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=true
      - REDIS_HOST=langfuse-redis
      - REDIS_PORT=6379
      - REDIS_AUTH=password123

  langfuse-server:
    image: docker.io/langfuse/langfuse:3
    container_name: langfuse-server
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      langfuse-pg:   
        condition: service_healthy
      langfuse-clickhouse:      # 這裡可以直接成功依賴了！
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:${PG_PASSWORD}@langfuse-pg:5432/langfuse
      # 【修正提示】這裡的主機名稱必須與 clickhouse 的服務名稱一致（即 langfuse-clickhouse）
      # 且資料庫名稱、帳密需與 clickhouse-compose.yml 對齊
      - CLICKHOUSE_URL=http://langfuse-clickhouse:8123
      - CLICKHOUSE_DB=my_database
      - CLICKHOUSE_MIGRATION_URL=${CLICKHOUSE_MIGRATION_URL}
      - CLICKHOUSE_USER=my_user
      - CLICKHOUSE_PASSWORD=my_password
      - SALT=${SALT}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=http://localhost:3000
      - TELEMETRY_ENABLED=false
      - CLICKHOUSE_CLUSTER_ENABLED=false
      - LANGFUSE_S3_EVENT_UPLOAD_BUCKET=langfuse
      - LANGFUSE_S3_EVENT_UPLOAD_REGION=us-east-1 # MinIO 默认填这个即可
      - LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=http://langfuse-minio:9000
      - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=minioadmin
      - LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=minioadminsecret
      - LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=true
      - REDIS_HOST=langfuse-redis
      - REDIS_PORT=6379
      - REDIS_AUTH=password123

  # ==========================================
  # 🌐 【業務層】Mock Web 應用
  # ==========================================
  web-app:
    build: .
    container_name: onto_web_app
    ports:
      - "5000:5000"
    command: ["python", "./src/webapp/mock_gateway.py"]
    environment:
      - APP_ENV=production
    restart: always

  # ==========================================
  # ⚡ 【工具層】通用 MCP Server
  # ==========================================
  mcp-server:
    build: .
    container_name: onto_mcp_server
    ports:
      - "8001:8001"
    command: ["python", "src/mcp_server/server.py"]
    environment:
      - NEO4J_URI=bolt://host.docker.internal:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - INTERNAL_WEB_API_URL=http://web-app:5000
    depends_on:
      - web-app
    restart: always
  
  # ==========================================
  # 🧠 【大腦層】Agent API (FastAPI)
  # ==========================================
  agent-api:
    build: .
    container_name: onto_agent_api
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - HUGGINGFACEHUB_API_TOKEN=${HUGGING_FACE_API_KEY}
      - MCP_SERVER_URL=http://mcp-server:8001/mcp
      
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_HOST=http://langfuse-server:3000 
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://langfuse-server:3000/api/public/otel
      - DATABASE_URL=${DATABASE_URL}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    depends_on:
      - mcp-server
      - langfuse-server
    restart: always

  # ==========================================
  # 💻 【前端層】Agent UI (Streamlit)
  # ==========================================
  agent-ui:
    build: .
    container_name: onto_agent_ui
    ports:
      - "8501:8501"
    environment:
      - MCP_SERVER_URL=http://mcp-server:8001/mcp
      # 確保 UI 可以連到 API
      - API_BASE_URL=http://agent-api:8000 
    depends_on:
      agent-api:
        condition: service_healthy
    command: ["streamlit", "run", "./src/main.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    restart: always

  # ==========================================
  # 🤖 【介面層】Discord 機器人
  # ==========================================
  discord-bot:
      build: .
      container_name: onto_discord_bot
      restart: always
      environment:
        - DISCORD_TOKEN=${DISCORD_TOKEN}
      command: ["python", "src/ui/discord_bot.py"]
      depends_on:
        agent-api:
          condition: service_healthy

volumes:
  langfuse_pg_data: