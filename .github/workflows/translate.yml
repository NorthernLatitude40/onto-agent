name: AI Translator

on:
  issues:
    types: [opened, edited]

  issue_comment:
    types: [created, edited]

  pull_request:
    types: [opened, edited]

  pull_request_review_comment:
    types: [created, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.API_KEY }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            console.log("event =", context.eventName);
            console.log("action =", context.payload.action);
            
            console.log("issue =", !!context.payload.issue);
            console.log("comment =", !!context.payload.comment);
            console.log("pr =", !!context.payload.pull_request);
            
            const apiKey = process.env.GEMINI_API_KEY;

            function getText() {
              if (context.payload.issue)
                return context.payload.issue.body || "";

              if (context.payload.comment)
                return context.payload.comment.body || "";

              if (context.payload.pull_request)
                return context.payload.pull_request.body || "";

              return "";
            }

            const text = getText();

            if (!text.trim()) {
              console.log("Nothing to translate.");
              return;
            }

            const prompt = `
            Translate the following GitHub content into fluent English.

            Preserve:
            - Markdown
            - Code blocks
            - URLs
            - Issue format

            Only output the translated English.

            ${text}
            `;

            const response = await fetch(
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=" + apiKey,
              {
                method: "POST",
                headers: {
                  "Content-Type":"application/json"
                },
                body: JSON.stringify({
                  contents:[
                    {
                      parts:[
                        {
                          text:prompt
                        }
                      ]
                    }
                  ]
                })
              }
            );

            const json = await response.json();

            const translated =
              json.candidates?.[0]?.content?.parts?.[0]?.text;

            if (!translated) {
              console.log(json);
              return;
            }

            let issue_number;

            if (context.payload.issue)
              issue_number = context.payload.issue.number;
            else if (context.payload.pull_request)
              issue_number = context.payload.pull_request.number;
            else
              issue_number = context.issue.number;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: "## 🤖 English Translation\n\n" + translated
            });
