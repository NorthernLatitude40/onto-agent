name: Issue Auto Translator

on:
  issues:
    types: [opened, edited] # 當有新 Issue 建立或編輯時觸發

jobs:
  translate:
    runs-on: ubuntu-latest
    permissions:
      issues: write # 必須賦予 Issue 寫入權限才能發送留言
    steps:
      - name: Auto Translate Issue
        uses: lycheeverse/translate-action@v1
        with:
          gemini-api-key: ${{ secrets.API_KEY }}
          target-language: 'English'
          github-token: ${{ secrets.GITHUB_TOKEN }}