name: CI Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. 安裝並設定 uv
    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"
        enable-cache: true # 開啟快取以大幅加速後續 CI 執行

    # 2. 設定 Python 版本
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 3. 透過 uv 安裝專案與所有依賴（包含測試工具與可編輯套件）
    - name: Install dependencies
      run: |
        uv sync --all-extras --dev

    # 4. 使用 Ruff 檢查專案原始碼 (極速且不會讀到 .venv)
    - name: Lint with Ruff
      run: |
        uvx ruff check src test

    # 5. 透過 uv 執行 pytest
    - name: Test with pytest
      run: |
        uv run pytest test/unit -m "not integration" --durations=5
      env:
        PYTHONPATH: src
