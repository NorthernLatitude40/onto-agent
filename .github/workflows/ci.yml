name: CI Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest # 安裝 Linter (flake8) 與測試工具 (pytest)
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint with flake8 (語法檢查)
      run: |
        # 檢查語法錯誤或未定義的變數
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Test with pytest (自動測試)
      run: |
        pytest
