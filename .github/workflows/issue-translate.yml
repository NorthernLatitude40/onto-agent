name: Auto Translate Issues & Comments

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]

jobs:
  translate:
    runs-on: ubuntu-latest
    # 避免機器人對自己發出的翻譯評論再次觸發，造成無限迴圈
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Translate Issue or Comment
        uses: actions-translators/auto-translate@v1
        with:
          # 目標語言：設為繁體中文 (zh-TW) 或簡體中文 (zh-CN)
          target-language: 'zh-TW'
          # 使用預設 GitHub Token 發布翻譯回應
          repo-token: ${{ secrets.GITHUB_TOKEN }}